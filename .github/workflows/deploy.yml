name: Deploy Chakudya Gateway to Cloudflare Workers

# Same setup as chakudya-api: add the repo secret CLOUDFLARE_API_TOKEN
# (Settings -> Secrets and variables -> Actions). Every push to main deploys.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
