name: Deploy Chakudya Gateway to Cloudflare Workers (manual)

# The gateway is deployed by Cloudflare's Git integration (Workers & Pages -> chakudya-gateway -> Settings -> Build),
# not by this workflow. This workflow used to run on every push and fail without a CLOUDFLARE_API_TOKEN repo secret,
# which sent a failure email even though the Cloudflare deploy had succeeded. It now runs only when started by hand
# from the Actions tab, and only if the CLOUDFLARE_API_TOKEN secret is set (Settings -> Secrets and variables -> Actions).

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
